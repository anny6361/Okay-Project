name: Apply OCR source fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/patch-ocr-handler.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted source patch
        run: python tools/patch-ocr-handler.py
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MyRequestsView.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix OCR response body handling at source'
          git push
