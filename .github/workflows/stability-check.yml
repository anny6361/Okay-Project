name: Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply direct OCR source fix
        if: github.event_name == 'push'
        run: |
          python tools/patch-ocr-handler.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MyRequestsView.tsx
          if git diff --cached --quiet; then
            echo 'No OCR source change needed.'
          else
            git commit -m 'Fix OCR response body handling at source'
            git push
          fi

      - name: Install dependencies after source patch
        if: github.event_name == 'push'
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build
