name: Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time PDF viewer fix
        if: github.event_name == 'push' && hashFiles('.github/pdf-viewer-patch') != ''
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/MyRequestsView.tsx')
          s = p.read_text(encoding='utf-8')

          old = """const isPdf = attType.includes('pdf') || \n                      attUrl.startsWith('data:application/pdf') || \n                      attUrl.includes('.pdf') || \n                      attUrl.startsWith('jvberi');\n\n        const safeUrl = getSafePreviewUrl(currentAtt.dataUrl);"""
          new = """const currentAttachmentType = String(currentAtt.type || '').toLowerCase().trim();
        const currentAttachmentName = String(currentAtt.name || '').toLowerCase().trim();
        const isPdf = currentAttachmentType.includes('pdf') ||\n                      currentAttachmentName.endsWith('.pdf') ||\n                      attType.includes('pdf') || \n                      attUrl.startsWith('data:application/pdf') || \n                      attUrl.includes('.pdf') || \n                      attUrl.startsWith('jvberi');\n\n        const safeUrl = getSafePreviewUrl(currentAtt.dataUrl);"""
          if old not in s:
              raise SystemExit('MyRequestsView PDF block not found')
          s = s.replace(old, new, 1)

          old2 = """items: attachmentList.map(a => ({\n                        url: getSafePreviewUrl(a.dataUrl),\n                        title: a.name || 'เอกสารแนบ',\n                        name: a.name || 'เอกสารแนบ',\n                        type: (a.dataUrl.toLowerCase().includes('.pdf') || a.dataUrl.startsWith('data:application/pdf')) ? 'pdf' : 'image'\n                      })),"""
          new2 = """items: attachmentList.map(a => {\n                        const attachmentUrl = String(a.dataUrl || '');\n                        const attachmentType = String(a.type || '').toLowerCase().trim();\n                        const attachmentName = String(a.name || '').toLowerCase().trim();\n                        const attachmentIsPdf = attachmentType.includes('pdf') ||\n                          attachmentName.endsWith('.pdf') ||\n                          attachmentUrl.toLowerCase().startsWith('data:application/pdf') ||\n                          attachmentUrl.toLowerCase().includes('.pdf') ||\n                          attachmentUrl.startsWith('JVBERi');\n                        return {\n                          url: getSafePreviewUrl(attachmentUrl),\n                          title: a.name || 'เอกสารแนบ',\n                          name: a.name || 'เอกสารแนบ',\n                          type: attachmentIsPdf ? 'pdf' : 'image'\n                        };\n                      }),"""
          if old2 not in s:
              raise SystemExit('MyRequestsView attachment items block not found')
          s = s.replace(old2, new2, 2)
          p.write_text(s, encoding='utf-8')

          p = Path('src/components/PdfPreviewModal.tsx')
          s = p.read_text(encoding='utf-8')
          marker = """  // Check if string contains an iframe with PDF or image\n"""
          insertion = """  // Firebase Storage download URLs often do not contain the original .pdf suffix.\n  // Treat a real HTTP(S) URL as a remote file instead of rendering the URL text as HTML.\n  if (lower.startsWith('http://') || lower.startsWith('https://')) {\n    const looksLikeImage = /\\.(jpg|jpeg|png|webp|gif|svg|bmp)(\\?.*)?$/i.test(lower);\n    return {\n      isPdf: !looksLikeImage,\n      isImg: looksLikeImage,\n      isHtml: false,\n      targetUrl: str,\n      cleanHtml: ''\n    };\n  }\n\n"""
          if marker not in s:
              raise SystemExit('PdfPreviewModal URL marker not found')
          s = s.replace(marker, insertion + marker, 1)
          p.write_text(s, encoding='utf-8')

          Path('.github/pdf-viewer-patch').unlink()
          print('PDF viewer patch applied')

      - name: Commit one-time PDF viewer fix
        if: github.event_name == 'push' && hashFiles('.github/pdf-viewer-patch') == '' && github.event.head_commit.message == 'Run PDF viewer patch once'
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- src/components/MyRequestsView.tsx src/components/PdfPreviewModal.tsx; then
            echo 'No PDF viewer changes detected'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MyRequestsView.tsx src/components/PdfPreviewModal.tsx .github/pdf-viewer-patch
          git commit -m 'Fix PDF attachment viewer'
          git push

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build
