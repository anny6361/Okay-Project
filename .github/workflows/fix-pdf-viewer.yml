name: Fix PDF attachment viewer

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix PDF attachment viewer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch attachment MIME handling
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/MyRequestsView.tsx')
          s = p.read_text(encoding='utf-8')

          old = """const isPdf = attType.includes('pdf') || \n                      attUrl.startsWith('data:application/pdf') || \n                      attUrl.includes('.pdf') || \n                      attUrl.startsWith('jvberi');\n\n        const safeUrl = getSafePreviewUrl(currentAtt.dataUrl);"""
          new = """const currentAttachmentType = String(currentAtt.type || '').toLowerCase().trim();
        const currentAttachmentName = String(currentAtt.name || '').toLowerCase().trim();
        const isPdf = currentAttachmentType.includes('pdf') ||\n                      currentAttachmentName.endsWith('.pdf') ||\n                      attType.includes('pdf') || \n                      attUrl.startsWith('data:application/pdf') || \n                      attUrl.includes('.pdf') || \n                      attUrl.startsWith('jvberi');\n\n        const safeUrl = getSafePreviewUrl(currentAtt.dataUrl);"""
          if old not in s:
              raise SystemExit('MyRequestsView: expected PDF detection block not found')
          s = s.replace(old, new, 1)

          old2 = """items: attachmentList.map(a => ({\n                        url: getSafePreviewUrl(a.dataUrl),\n                        title: a.name || 'เอกสารแนบ',\n                        name: a.name || 'เอกสารแนบ',\n                        type: (a.dataUrl.toLowerCase().includes('.pdf') || a.dataUrl.startsWith('data:application/pdf')) ? 'pdf' : 'image'\n                      })),"""
          new2 = """items: attachmentList.map(a => {\n                        const attachmentUrl = String(a.dataUrl || '');\n                        const attachmentType = String(a.type || '').toLowerCase().trim();\n                        const attachmentName = String(a.name || '').toLowerCase().trim();\n                        const attachmentIsPdf = attachmentType.includes('pdf') ||\n                          attachmentName.endsWith('.pdf') ||\n                          attachmentUrl.toLowerCase().startsWith('data:application/pdf') ||\n                          attachmentUrl.toLowerCase().includes('.pdf') ||\n                          attachmentUrl.startsWith('JVBERi');\n                        return {\n                          url: getSafePreviewUrl(attachmentUrl),\n                          title: a.name || 'เอกสารแนบ',\n                          name: a.name || 'เอกสารแนบ',\n                          type: attachmentIsPdf ? 'pdf' : 'image'\n                        };\n                      }),"""
          if old2 not in s:
              raise SystemExit('MyRequestsView: expected attachment items block not found')
          s = s.replace(old2, new2, 2)
          p.write_text(s, encoding='utf-8')

          p = Path('src/components/PdfPreviewModal.tsx')
          s = p.read_text(encoding='utf-8')

          old3 = """  if (hintType === 'pdf' || lower.startsWith('data:application/pdf') || lower.startsWith('blob:application/pdf') || (lower.startsWith('http') && lower.includes('.pdf'))) {\n    return { isPdf: true, isImg: false, isHtml: false, targetUrl: str, cleanHtml: '' };\n  }\n\n  if (hintType === 'image' || lower.startsWith('data:image/') || /\\.(jpg|jpeg|png|webp|gif|svg|bmp)(\\?.*)?$/i.test(lower)) {"""
          new3 = """  if (hintType === 'pdf' || lower.startsWith('data:application/pdf') || lower.startsWith('blob:application/pdf') || (lower.startsWith('http') && lower.includes('.pdf'))) {\n    return { isPdf: true, isImg: false, isHtml: false, targetUrl: str, cleanHtml: '' };\n  }\n\n  if (hintType === 'image' || lower.startsWith('data:image/') || /\\.(jpg|jpeg|png|webp|gif|svg|bmp)(\\?.*)?$/i.test(lower)) {"""
          if old3 not in s:
              raise SystemExit('PdfPreviewModal: expected parse block not found')
          # Keep the existing explicit type logic, then make HTTP(S) storage URLs file URLs rather than HTML.
          s = s.replace(old3, new3, 1)

          marker = """  // Check if string contains an iframe with PDF or image\n"""
          insertion = """  // Firebase Storage download URLs often do not contain the original .pdf suffix.\n  // If the caller did not provide a type hint, treat a real HTTP(S) URL as a remote file\n  // instead of rendering the URL text itself as HTML. The upload flow supplies the exact\n  // MIME type above, so PDF/image items will still be classified correctly.\n  if (lower.startsWith('http://') || lower.startsWith('https://')) {\n    const looksLikeImage = /\\.(jpg|jpeg|png|webp|gif|svg|bmp)(\\?.*)?$/i.test(lower);\n    return {\n      isPdf: !looksLikeImage,\n      isImg: looksLikeImage,\n      isHtml: false,\n      targetUrl: str,\n      cleanHtml: ''\n    };\n  }\n\n"""
          if marker not in s:
              raise SystemExit('PdfPreviewModal: insertion marker not found')
          s = s.replace(marker, insertion + marker, 1)
          p.write_text(s, encoding='utf-8')

          print('PDF viewer MIME/URL patch applied')

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/MyRequestsView.tsx src/components/PdfPreviewModal.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MyRequestsView.tsx src/components/PdfPreviewModal.tsx
          git commit -m 'Fix PDF attachment viewer' || exit 0
          git push
