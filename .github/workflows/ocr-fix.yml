name: Fix AI OCR reader

on:
  push:
    paths:
      - '.github/workflows/ocr-fix.yml'

permissions:
  contents: write

jobs:
  patch-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch OCR response handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/MyRequestsView.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''      if (!response.ok) {
        let errMessage = `Server returned ${response.status}`;
        try {
          const errJson = await response.json();
          if (errJson && errJson.error) {
            errMessage = errJson.error;
          }
        } catch {
          const text = await response.text();
          if (text) errMessage = text;
        }
        throw new Error(errMessage);
      }
'''

          new = '''      if (!response.ok) {
        let errMessage = `Server returned ${response.status}`;
        try {
          // Read the response body exactly once to avoid
          // "body stream already read" when JSON parsing fails.
          const responseBody = await response.text();
          if (responseBody) {
            try {
              const errJson = JSON.parse(responseBody);
              if (errJson && errJson.error) {
                errMessage = String(errJson.error);
              } else {
                errMessage = responseBody;
              }
            } catch {
              errMessage = responseBody;
            }
          }
        } catch {
          // Keep the HTTP status message if the error body cannot be read.
        }
        throw new Error(errMessage);
      }
'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected OCR error block exactly once, found {text.count(old)}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit OCR fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MyRequestsView.tsx
          git diff --cached --check
          git diff --cached -- src/components/MyRequestsView.tsx
          git commit -m "fix: prevent AI OCR response body double-read"
          git push
