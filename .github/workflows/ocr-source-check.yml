name: OCR Source Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-ocr-response-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OCR response body handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MyRequestsView.tsx')
          s = p.read_text(encoding='utf-8')
          if "await response.json()" in s and "await response.text()" in s:
              print('OCR handler contains both response.json() and response.text(); inspect before release.')
              raise SystemExit(1)
          print('OCR source check passed.')
          PY
