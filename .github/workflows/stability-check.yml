name: Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

  fix-ocr-once:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted OCR fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/MyRequestsView.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    let errMessage = `Server returned ${response.status}`;

    try {
      const errJson = await response.json();
      if (errJson && errJson.error) {
        errMessage = errJson.error;
      }
    } catch {
      const text = await response.text();
      if (text) errMessage = text;
    }
    throw new Error(errMessage);'''
          new = '''    let errMessage = `Server returned ${response.status}`;

    try {
      const responseBody = await response.text();

      if (responseBody) {
        try {
          const errJson = JSON.parse(responseBody);

          if (errJson && errJson.error) {
            errMessage = String(errJson.error);
          } else {
            errMessage = responseBody;
          }
        } catch {
          errMessage = responseBody;
        }
      }
    } catch {
      // Keep HTTP status message
    }
    throw new Error(errMessage);'''
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('OCR fix applied.')
          elif new in s:
              print('OCR fix already applied.')
          else:
              raise SystemExit('Expected OCR error-handler block was not found; stopping safely.')
          PY

      - name: Verify source
        run: |
          grep -n -A24 -B2 "const responseBody = await response.text()" src/components/MyRequestsView.tsx

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          if git diff --quiet -- src/components/MyRequestsView.tsx && [ ! -f .github/workflows/ocr-fix-once.yml ]; then
            echo "OCR fix already applied and cleanup already complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MyRequestsView.tsx
          if [ -f .github/workflows/ocr-fix-once.yml ]; then
            git rm .github/workflows/ocr-fix-once.yml
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix OCR response body handling"
          git push origin HEAD:main
